name: Build LunarVoid APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lunarvoid-src.zip'
      - 'lunarvoid-src (1).zip'
      - '.github/workflows/lunarvoid-src (2).zip'
      - 'lunarvoid-src (3).zip'
      - 'LunarVoid_MenuPreview_v4.html'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect and unpack Android source
        run: |
          SOURCE_ZIP=''
          if [ -f 'lunarvoid-src (3).zip' ]; then SOURCE_ZIP='lunarvoid-src (3).zip'; elif [ -f '.github/workflows/lunarvoid-src (2).zip' ]; then SOURCE_ZIP='.github/workflows/lunarvoid-src (2).zip'; elif [ -f 'lunarvoid-src (1).zip' ]; then SOURCE_ZIP='lunarvoid-src (1).zip'; elif [ -f 'lunarvoid-src.zip' ]; then SOURCE_ZIP='lunarvoid-src.zip'; else echo 'No lunarvoid source ZIP found'; exit 1; fi
          echo "Building from: $SOURCE_ZIP"
          unzip -l "$SOURCE_ZIP"
          mkdir -p src
          unzip -q -o "$SOURCE_ZIP" -d src
          find src -maxdepth 4 -type f | sort | head -200
          # Enable Android's native file picker for HTML file inputs in WebView.
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = list(Path("src/app/src/main/java").rglob("MainActivity.java"))
          if not files:
              raise SystemExit("MainActivity.java not found; cannot wire the Android file chooser")
          p = files[0]
          code = p.read_text()
          package = re.search(r"^package [^;]+;", code, re.M)
          if not package:
              raise SystemExit("Could not find package declaration in MainActivity.java")
          imports = [
              "import android.app.Activity;",
              "import android.content.Intent;",
              "import android.net.Uri;",
              "import android.webkit.ValueCallback;",
              "import android.webkit.WebChromeClient;",
              "import android.webkit.WebView;",
          ]
          for item in imports:
              if item not in code:
                  package = re.search(r"^package [^;]+;", code, re.M)
                  code = code[:package.end()] + "\n" + item + code[package.end():]
          if "private ValueCallback<Uri[]> lunarVoidFileCallback" not in code:
              class_decl = re.search(r"class MainActivity[^{]*{", code)
              if not class_decl:
                  raise SystemExit("Could not find MainActivity class declaration")
              methods = '''
              private static final int LUNARVOID_FILE_CHOOSER_REQUEST = 4817;
              private ValueCallback<Uri[]> lunarVoidFileCallback;

              private void configureLunarVoidFileChooser(WebView target) {
                  target.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (lunarVoidFileCallback != null) lunarVoidFileCallback.onReceiveValue(null);
                          lunarVoidFileCallback = callback;
                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("*/*");
                          String[] accept = params.getAcceptTypes();
                          if (accept != null && accept.length > 0) intent.putExtra(Intent.EXTRA_MIME_TYPES, accept);
                          try {
                              startActivityForResult(Intent.createChooser(intent, "Select a skin or resource pack"), LUNARVOID_FILE_CHOOSER_REQUEST);
                          } catch (Exception error) {
                              lunarVoidFileCallback = null;
                              callback.onReceiveValue(null);
                              return false;
                          }
                          return true;
                      }
                  });
              }
              '''
              code = code[:class_decl.end()] + methods + code[class_decl.end():]
          if "configureLunarVoidFileChooser(webView);" not in code and "configureLunarVoidFileChooser(mWebView);" not in code:
              m = re.search(r"(\w+)\.setWebViewClient\(", code)
              webview_name = m.group(1) if m else None
              if not webview_name:
                  m = re.search(r"WebView\s+(\w+)\s*(?:=|;)", code)
                  if not m:
                      raise SystemExit("Could not locate a WebView variable to attach the file chooser")
                  webview_name = m.group(1)
              load = re.search(re.escape(webview_name) + r"\.(?:loadUrl|loadDataWithBaseURL)\([^;]*;", code)
              if load:
                  insertion = load.end()
                  code = code[:insertion] + "\n        configureLunarVoidFileChooser(" + webview_name + ");" + code[insertion:]
              else:
                  raise SystemExit("Could not find the WebView page-load statement to attach the file chooser")
          if "LUNARVOID_FILE_CHOOSER_REQUEST && lunarVoidFileCallback" not in code:
              callback = '''
              if (requestCode == LUNARVOID_FILE_CHOOSER_REQUEST && lunarVoidFileCallback != null) {
                  Uri[] result = resultCode == Activity.RESULT_OK && data != null && data.getData() != null
                      ? new Uri[] { data.getData() } : null;
                  lunarVoidFileCallback.onReceiveValue(result);
                  lunarVoidFileCallback = null;
              }
              '''
              existing = re.search(r"protected void onActivityResult\s*\([^)]*\)\s*\{", code)
              if existing:
                  depth = 1
                  i = existing.end()
                  while i < len(code) and depth:
                      if code[i] == "{": depth += 1
                      elif code[i] == "}": depth -= 1
                      i += 1
                  code = code[:i - 1] + callback + code[i - 1:]
              else:
                  class_decl = re.search(r"class MainActivity[^{]*{", code)
                  code = code[:class_decl.end()] + '''
              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
              ''' + callback + '''
              }
              ''' + code[class_decl.end():]
          p.write_text(code)
          print("Enabled Android file chooser in", p)
          PY
          test -f LunarVoid_MenuPreview_v4.html
          test -f src/app/src/main/assets/index.html
          cp LunarVoid_MenuPreview_v4.html src/app/src/main/assets/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("src/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          text, count = re.subn(r'android:label="[^"]*"', 'android:label="LunarVoidProxy"', text, count=1)
          if count == 0:
              text = text.replace("<application", '<application android:label="LunarVoidProxy"', 1)
          manifest.write_text(text)
          PY
          echo "Bundled LunarVoid_MenuPreview_v4.html as the app's index.html."
          grep -n 'android:label' src/app/src/main/AndroidManifest.xml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Build Go engine for Android (if present)
        shell: bash
        run: |
          if [ -d src/engine ] && [ -f src/engine/go.mod ]; then
            export PATH="$PATH:$(go env GOPATH)/bin"
            export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
            cd src/engine
            go mod tidy
            go install golang.org/x/mobile/cmd/gomobile@latest
            go get golang.org/x/mobile/bind
            gomobile init
            mkdir -p ../app/libs
            gomobile bind -target=android/arm64 -androidapi 26 -ldflags="-s -w -checklinkname=0" -o ../app/libs/engine.aar .
          else
            echo "No Go engine found; skipping gomobile build."
          fi

      - name: Build Android APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: ':app:assembleDebug --no-daemon'
          build-root-directory: src

      - name: Name APK LunarVoidProxy.apk
        run: cp src/app/build/outputs/apk/debug/app-debug.apk src/app/build/outputs/apk/debug/LunarVoidProxy.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LunarVoidProxy
          path: src/app/build/outputs/apk/debug/LunarVoidProxy.apk
          if-no-files-found: error
