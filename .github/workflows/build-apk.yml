name: Build LunarVoid APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lunarvoid-src.zip'
      - 'LunarVoid_MenuPreview_v4.html'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect and unpack Android source
        run: |
          unzip -l lunarvoid-src.zip
          mkdir -p src
          unzip -q -o lunarvoid-src.zip -d src
          find src -maxdepth 4 -type f | sort | head -200
          # Enable Android's native file picker for HTML file inputs in WebView.
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = list(Path("src/app/src/main/java").rglob("MainActivity.java"))
          if not files:
              raise SystemExit("MainActivity.java not found; cannot wire the Android file chooser")
          p = files[0]
          code = p.read_text()
          imports = [
              "import android.app.Activity;",
              "import android.content.Intent;",
              "import android.net.Uri;",
              "import android.webkit.ValueCallback;",
              "import android.webkit.WebChromeClient;",
              "import android.webkit.WebView;",
              "import android.webkit.WebChromeClient.FileChooserParams;",
          ]
          package = re.search(r"^package [^;]+;", code, re.M)
          if not package:
              raise SystemExit("Could not find package declaration in MainActivity.java")
          for item in imports:
              if item not in code:
                  code = code[:package.end()] + "\\n" + item + code[package.end():]
                  package = re.search(r"^package [^;]+;", code, re.M)
          if "private ValueCallback<Uri[]> lunarVoidFileCallback" not in code:
              class_decl = re.search(r"class MainActivity[^\\{]*\\{", code)
              if not class_decl:
                  raise SystemExit("Could not find MainActivity class declaration")
              methods = '''\n    private static final int LUNARVOID_FILE_CHOOSER_REQUEST = 4817;\n    private ValueCallback<Uri[]> lunarVoidFileCallback;\n\n    private void configureLunarVoidFileChooser(WebView target) {\n        target.setWebChromeClient(new WebChromeClient() {\n            @Override\n            public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> callback, FileChooserParams params) {\n                if (lunarVoidFileCallback != null) lunarVoidFileCallback.onReceiveValue(null);\n                lunarVoidFileCallback = callback;\n                Intent intent = new Intent(Intent.ACTION_GET_CONTENT);\n                intent.addCategory(Intent.CATEGORY_OPENABLE);\n                intent.setType("*/*");\n                String[] accept = params.getAcceptTypes();\n                if (accept != null && accept.length > 0) intent.putExtra(Intent.EXTRA_MIME_TYPES, accept);\n                try { startActivityForResult(Intent.createChooser(intent, "Select a skin or resource pack"), LUNARVOID_FILE_CHOOSER_REQUEST); }\n                catch (Exception error) { lunarVoidFileCallback = null; callback.onReceiveValue(null); return false; }\n                return true;\n            }\n        });\n    }\n\n    @Override\n    protected void onActivityResult(int requestCode, int resultCode, Intent data) {\n        super.onActivityResult(requestCode, resultCode, data);\n        if (requestCode == LUNARVOID_FILE_CHOOSER_REQUEST && lunarVoidFileCallback != null) {\n            Uri[] result = resultCode == Activity.RESULT_OK && data != null && data.getData() != null\n                ? new Uri[] { data.getData() } : null;\n            lunarVoidFileCallback.onReceiveValue(result);\n            lunarVoidFileCallback = null;\n        }\n    }\n'''
              code = code[:class_decl.end()] + methods + code[class_decl.end():]
          if "configureLunarVoidFileChooser(" not in code[code.find("private void configureLunarVoidFileChooser"):]:
              raise SystemExit("File chooser helper insertion failed")
          if "configureLunarVoidFileChooser(" not in code[code.find("private void configureLunarVoidFileChooser") + 1:]:
              # Find the WebView variable from common initialization patterns and wire it once.
              patterns = [r"(\\w+)\\.setWebViewClient\\("]
              found = None
              for pattern in patterns:
                  m = re.search(pattern, code)
                  if m:
                      found = m.group(1); pos = m.end(); break
              if not found:
                  # Fallback for projects using a variable named webView and no explicit client call.
                  if re.search(r"WebView\\s+webView\\s*=", code):
                      m = re.search(r"WebView\\s+webView\\s*=.*?;", code, re.S)
                      found, pos = "webView", m.end()
                  else:
                      raise SystemExit("Could not locate WebView initialization to attach file chooser")
              code = code[:pos] + "\\n        configureLunarVoidFileChooser(" + found + ");" + code[pos:]
          p.write_text(code)
          print("Enabled native Android file selection in", p)
          PY
          test -f LunarVoid_MenuPreview_v4.html
          test -f src/app/src/main/assets/index.html
          cp LunarVoid_MenuPreview_v4.html src/app/src/main/assets/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("src/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          text, count = re.subn(r'android:label="[^"]*"', 'android:label="LunarVoidProxy"', text, count=1)
          if count == 0:
              text = text.replace("<application", '<application android:label="LunarVoidProxy"', 1)
          manifest.write_text(text)
          PY
          echo "Bundled LunarVoid_MenuPreview_v4.html as the app's index.html."
          grep -n 'android:label' src/app/src/main/AndroidManifest.xml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Build Go engine for Android (if present)
        shell: bash
        run: |
          if [ -d src/engine ] && [ -f src/engine/go.mod ]; then
            export PATH="$PATH:$(go env GOPATH)/bin"
            export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
            cd src/engine
            go mod tidy
            go install golang.org/x/mobile/cmd/gomobile@latest
            go get golang.org/x/mobile/bind
            gomobile init
            mkdir -p ../app/libs
            gomobile bind -target=android/arm64 -androidapi 26 -ldflags="-s -w -checklinkname=0" -o ../app/libs/engine.aar .
          else
            echo "No Go engine found; skipping gomobile build."
          fi

      - name: Build Android APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: ':app:assembleDebug --no-daemon'
          build-root-directory: src

      - name: Name APK LunarVoidProxy.apk
        run: cp src/app/build/outputs/apk/debug/app-debug.apk src/app/build/outputs/apk/debug/LunarVoidProxy.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LunarVoidProxy
          path: src/app/build/outputs/apk/debug/LunarVoidProxy.apk
          if-no-files-found: error
