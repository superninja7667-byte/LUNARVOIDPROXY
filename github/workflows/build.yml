name: Build APK  on:   workflow_dispatch:   push:     branches: [main]  jobs:   build:     runs-on: ubuntu-latest     steps:       - uses: actions/checkout@v4        - name: Unpack the source zip         run: unzip -q -o lunarvoid-src.zip -d src        - uses: actions/setup-java@v4         with:           distribution: temurin           java-version: '17'        - uses: actions/setup-go@v5         with:           go-version: stable           check-latest: true           cache: false        - name: Install Android SDK pieces         run: |           yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true           "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"        - name: Build the Go engine         working-directory: src/engine         run: |           export PATH="$PATH:$(go env GOPATH)/bin"           export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"           go mod tidy           go install golang.org/x/mobile/cmd/gomobile@latest           go get golang.org/x/mobile/bind           gomobile init           mkdir -p ../app/libs           gomobile bind -target=android/arm64 -androidapi 26 -ldflags="-s -w" -o ../app/libs/engine.aar .        - uses: gradle/actions/setup-gradle@v4         with:           gradle-version: '8.9'        - name: Build the APK         working-directory: src         run: gradle :app:assembleDebug --no-daemon        - uses: actions/upload-artifact@v4         with:           name: LunarVoidProxy-APK           path: src/app/build/outputs/apk/debug/app-debug.apk
